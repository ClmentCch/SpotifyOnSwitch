name: Build Spotify.nro

# Every push to main builds the NRO and keeps it as an artifact. A tag v* also
# publishes a release: Spotify.nro, the Chromium engine image the app downloads
# on its first start, and the manifest that ties them together.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # The Linux kernel LKL builds on, pinned (scripts/fetch-kernel.sh).
  KERNEL_SHA: d0f76a77e8c2ca68bd7d96190b8da09040eab072
  # devkitPro's devkitA64, pinned by digest.
  DEVKITA64: devkitpro/devkita64@sha256:82575ea78651b530b2e232bb3799cfd1fe331514e053d5f724bb4b28191fb79d

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Let the runner execute arm64 binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          ls /proc/sys/fs/binfmt_misc/ | head

      - name: Build the engine's container
        run: |
          docker build -t spotify-engine \
            -f vendor/chromium-nx/gx/docker/Dockerfile vendor/chromium-nx/gx/docker

      - name: Build the web engine (kernel library, guest libraries, Chromium image)
        run: |
          set -euo pipefail
          docker run -d --name spotify-engine-run \
            -v "$PWD:/project" -v spotify-work:/work spotify-engine sleep infinity
          docker exec spotify-engine-run bash /project/scripts/fetch-kernel.sh /work/linux
          docker exec -e WORK=/work spotify-engine-run bash /project/scripts/build-engine.sh

      - name: Build Spotify.nro
        run: |
          set -euo pipefail
          docker run -d --name spotify-nx \
            -v "$PWD:/project" -v spotify-work:/work "$DEVKITA64" sleep infinity
          docker exec spotify-nx apt-get update
          docker exec spotify-nx apt-get install -y --no-install-recommends \
            flex bison bc libelf-dev cpio rsync build-essential
          docker exec -e WORK=/work spotify-nx bash /project/scripts/build-nro.sh

      - name: Remove the containers
        if: always()
        run: |
          docker rm -f spotify-engine-run spotify-nx || true
          # The containers write dist/ as root; the steps after this one are
          # the runner's user.
          sudo chown -R "$(id -u):$(id -g)" dist || true

      - name: Verify the NRO, the engine image and the manifest
        run: bash scripts/verify.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum Spotify.nro spotify-engine.ext4 > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Spotify
          path: |
            dist/Spotify.nro
            dist/spotify-engine.ext4
            dist/manifest.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Spotify
          path: dist

      - name: Publish "Spotify <tag>"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::the release $tag exists already; a stable version is never replaced"
            exit 1
          fi
          gh release create "$tag" \
            --title "Spotify $tag" \
            --notes-file .github/release-notes.md \
            dist/Spotify.nro dist/spotify-engine.ext4 dist/manifest.txt dist/SHA256SUMS
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'
